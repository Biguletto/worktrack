AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WorkTrack baseline deployment: EC2 web host, private Amazon RDS PostgreSQL,
  private S3 storage, VPC networking, security groups, optional managed IAM
  instance role (or a supplied instance profile), and a Secrets Manager-managed database password.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu Server 24.04 LTS AMI ID for the selected AWS Region.
  AdminCidr:
    Type: String
    Description: Your public IP range in CIDR notation for SSH (for example 203.0.113.10/32).
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
  KeyName:
    Type: String
    Default: ''
    Description: Optional EC2 key pair name. Systems Manager Session Manager is preferred.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
  DBName:
    Type: String
    Default: worktrack
    AllowedPattern: '^[A-Za-z][A-Za-z0-9]*$'
  ProjectPrefix:
    Type: String
    Default: worktrack
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
  UseManagedIamRole:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Use true for a personal AWS account; use false in a restricted Learner Lab and supply its existing instance profile below.
  ExistingInstanceProfileName:
    Type: String
    Default: ''
    Description: Existing learner-lab instance profile name or ARN. Required when UseManagedIamRole is false; it must already grant the app the required S3 and Secrets Manager access.
  EnableDatabaseProvisioning:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Temporarily allow EC2 to read the RDS master secret while the app database user is provisioned. Disable after setup.
  EnableSesNotifications:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after verifying a sender identity in Amazon SES.
  SesIdentityArn:
    Type: String
    Default: ''
    Description: Optional SES identity ARN for the verified sender email/domain; required when SES notifications are enabled.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  CreateManagedIamResources: !Equals [!Ref UseManagedIamRole, 'true']
  EnableSes: !And [!Equals [!Ref EnableSesNotifications, 'true'], !Condition CreateManagedIamResources]
  EnableDbProvisioning: !And [!Equals [!Ref EnableDatabaseProvisioning, 'true'], !Condition CreateManagedIamResources]

Rules:
  LearnerLabRequiresExistingInstanceProfile:
    RuleCondition: !Equals [!Ref UseManagedIamRole, 'false']
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingInstanceProfileName, '']]
        AssertDescription: Provide the existing learner-lab EC2 instance profile name or ARN when UseManagedIamRole is false.
  SesNotificationsRequireIdentity:
    RuleCondition: !Equals [!Ref EnableSesNotifications, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref SesIdentityArn, '']]
        AssertDescription: Provide a verified SES identity ARN when SES notifications are enabled.

Resources:
  WorkTrackVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.24.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref WorkTrackVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkTrackVPC
      CidrBlock: 10.24.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-public-subnet'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkTrackVPC
      CidrBlock: 10.24.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkTrackVPC
      CidrBlock: 10.24.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkTrackVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkTrackVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-a-rt'

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkTrackVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-b-rt'

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkTrackVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web access and administrator SSH from the supplied IP range.
      VpcId: !Ref WorkTrackVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-ec2-sg'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access only from the WorkTrack EC2 security group.
      VpcId: !Ref WorkTrackVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-rds-sg'

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-uploads'

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt UploadsBucket.Arn
              - !Sub '${UploadsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectPrefix}/rds/master'
      Description: WorkTrack Amazon RDS PostgreSQL master credentials. Use only for initial database-user provisioning and administration.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"worktrack_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  ApplicationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectPrefix}/rds/application'
      Description: Least-privilege PostgreSQL application account used by the WorkTrack Django application.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"worktrack_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnet group spanning two Availability Zones.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-rds-subnets'

  WorkTrackDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectPrefix}-db'
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: worktrack_admin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-postgres'

  WorkTrackEC2Role:
    Type: AWS::IAM::Role
    Condition: CreateManagedIamResources
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WorkTrackS3AndDatabaseSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListWorkTrackPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt UploadsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - leave-documents/*
                      - worktrack-reports/*
              - Sid: ManageWorkTrackObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub '${UploadsBucket.Arn}/leave-documents/*'
                  - !Sub '${UploadsBucket.Arn}/worktrack-reports/*'
              - Sid: ReadWorkTrackApplicationSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApplicationDatabaseSecret
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-ec2-role'

  WorkTrackDatabaseProvisioningPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableDbProvisioning
    Properties:
      PolicyName: WorkTrackTemporaryDatabaseProvisioning
      Roles:
        - !Ref WorkTrackEC2Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DatabaseSecret

  WorkTrackSesPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableSes
    Properties:
      PolicyName: WorkTrackSesSendEmail
      Roles:
        - !Ref WorkTrackEC2Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Ref SesIdentityArn

  WorkTrackInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateManagedIamResources
    Properties:
      Roles:
        - !Ref WorkTrackEC2Role

  WorkTrackEC2:
    Type: AWS::EC2::Instance
    DependsOn: VPCGatewayAttachment
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !If [CreateManagedIamResources, !Ref WorkTrackInstanceProfile, !Ref ExistingInstanceProfileName]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip nginx git postgresql-client jq
          systemctl enable nginx
          systemctl start nginx
          mkdir -p /opt/worktrack /etc/worktrack
          chown -R www-data:www-data /opt/worktrack
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-web'

  WorkTrackElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WorkTrackEC2
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-eip'

Outputs:
  ApplicationPublicIP:
    Description: Elastic IP address for the WorkTrack EC2 instance.
    Value: !Ref WorkTrackElasticIP
  ApplicationPublicDNS:
    Description: Public DNS name of the WorkTrack EC2 instance.
    Value: !GetAtt WorkTrackEC2.PublicDnsName
  VPCId:
    Value: !Ref WorkTrackVPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
  EC2SecurityGroupId:
    Value: !Ref EC2SecurityGroup
  RDSSecurityGroupId:
    Value: !Ref RDSSecurityGroup
  DatabaseEndpoint:
    Description: Private Amazon RDS endpoint. Do not make it publicly accessible.
    Value: !GetAtt WorkTrackDatabase.Endpoint.Address
  DatabaseName:
    Value: !Ref DBName
  DatabaseSecretArn:
    Description: RDS master secret ARN. Temporary EC2 access is used only to provision the application database role; disable it after setup.
    Value: !Ref DatabaseSecret
  ApplicationDatabaseSecretArn:
    Description: Configure DB_SECRET_ARN on EC2 with this least-privilege application user secret.
    Value: !Ref ApplicationDatabaseSecret
  S3BucketName:
    Value: !Ref UploadsBucket
